name: Release Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-linux:
    name: Build - ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
            platform: windows
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
            platform: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            platform: linux
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: get_version
        shell: bash
        run: |
          VERSION=$(awk -F '"' '/^version/ {print $2; exit}' Cargo.toml)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install admin-ui dependencies
        working-directory: admin-ui
        run: pnpm install --frozen-lockfile

      - name: Build admin-ui
        working-directory: admin-ui
        run: pnpm build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-${{ matrix.target }}"
          cache-on-failure: true

      - name: Build app
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename and prepare binary
        shell: bash
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          if [ "${{ matrix.platform }}" = "windows" ]; then
            mv target/${{ matrix.target }}/release/kiro-rs.exe kiro-rs-v${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.exe
            echo "ASSET_PATH=kiro-rs-v${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.exe" >> $GITHUB_ENV
          else
            mv target/${{ matrix.target }}/release/kiro-rs kiro-rs-v${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}
            echo "ASSET_PATH=kiro-rs-v${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}" >> $GITHUB_ENV
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}

  build-macos:
    name: Build - macos (x86_64 & arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: get_version
        shell: bash
        run: |
          VERSION=$(awk -F '"' '/^version/ {print $2; exit}' Cargo.toml)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install admin-ui dependencies
        working-directory: admin-ui
        run: pnpm install --frozen-lockfile

      - name: Build admin-ui
        working-directory: admin-ui
        run: pnpm build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-macos"
          cache-on-failure: true

      - name: Build for macOS (arm64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build for macOS (x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Rename and prepare binaries
        shell: bash
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          mv target/aarch64-apple-darwin/release/kiro-rs kiro-rs-v${VERSION}-macos-arm64
          mv target/x86_64-apple-darwin/release/kiro-rs kiro-rs-v${VERSION}-macos-x86_64

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kiro-rs-v${{ steps.get_version.outputs.version }}-macos-arm64
            kiro-rs-v${{ steps.get_version.outputs.version }}-macos-x86_64
